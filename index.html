const col=i=>{let s='';for(i++;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s};
const fmt=(v,h)=>{if(typeof v!=='number')return v;if(h&&/%/.test(h)||(v>0&&v<=1&&h&&/Kết quả|Mục tiêu|% /.test(h)))return(v*100).toFixed(2)+'%';return v.toLocaleString('vi-VN')};
function render(k){
  const S=SHEETS[k],rows=S.rows,W=Math.max(...rows.map(r=>r.length));
  const hi=rows.findIndex(r=>r.length>=4&&r.every(x=>x===''||typeof x==='string')&&r.filter(x=>x).length>=4);
  let h='<tr><th class="rn"></th>';for(let c=0;c<W;c++)h+=`<th style="width:${c==0?170:c==4&&S.name=='ChiTiet_SKU'?300:120}px">${col(c)}</th>`;h+='</tr>';
  rows.forEach((r,i)=>{h+=`<tr><td class="rn">${i+1}</td>`;
    for(let c=0;c<W;c++){const v=r[c]===undefined?'':r[c];const hd=rows[hi]?rows[hi][c]:'';
      const cls=[typeof v==='number'?'num':'',i==hi?'h':'',(i==0||r[0]==='TỔNG')?'b':''].join(' ');
      const txt=(typeof v==='number'&&i>hi)?fmt(v,hd):v;
      h+=`<td class="${cls}" data-r="${i}" data-c="${c}" title="${String(v).replace(/"/g,'&quot;')}">${txt}</td>`}
    h+='</tr>'});
  document.getElementById('t').innerHTML=h;
  document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('on',i==k));
}
document.getElementById('tabs').innerHTML=SHEETS.map((s,i)=>`<button onclick="render(${i})">${s.name}</button>`).join('');
let cur=null;
document.getElementById('t').addEventListener('click',e=>{const td=e.target.closest('td[data-r]');if(!td)return;
  if(cur)cur.classList.remove('sel');cur=td;td.classList.add('sel');
  document.getElementById('nb').textContent=col(+td.dataset.c)+(+td.dataset.r+1);document.getElementById('fv').textContent=td.title});
render(0);
</script></body></html>
